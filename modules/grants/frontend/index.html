<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grants — Main Street AI</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2d3148;
    --accent: #6c63ff;
    --accent-hover: #5a52d5;
    --text: #e8eaf0;
    --muted: #8b8fa8;
    --success: #4caf82;
    --warning: #f0a500;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .logo span { color: var(--text); }
  .badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; margin-left: auto; }

  .container { max-width: 820px; margin: 0 auto; padding: 36px 24px 80px; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .tab { background: none; border: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 16px; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; transition: color .15s, border-color .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }

  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input, textarea, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px;
    font-family: inherit; outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 76px; }
  select option { background: var(--surface); }

  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .field { display: flex; flex-direction: column; }
  .field.full { grid-column: 1 / -1; }
  .hint { color: var(--muted); font-weight: 400; }

  .generate-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: background .15s, opacity .15s; letter-spacing: .02em; }
  .generate-btn:hover { background: var(--accent-hover); }
  .generate-btn:disabled { opacity: .5; cursor: not-allowed; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { margin-top: 30px; }
  .results-header { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }
  .results-header select { width: auto; padding: 6px 10px; font-size: 12px; margin-left: auto; }

  /* Grant cards */
  .grant-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .grant-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .grant-name { font-size: 16px; font-weight: 700; }
  .grant-funder { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .grant-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 20px; background: rgba(108,99,255,.15); color: #b9b4ff; white-space: nowrap; }
  .fit { margin-left: auto; text-align: right; flex-shrink: 0; }
  .fit-score { font-size: 20px; font-weight: 800; }
  .fit-bar { width: 90px; height: 6px; border-radius: 4px; background: var(--border); margin-top: 4px; overflow: hidden; }
  .fit-fill { height: 100%; background: linear-gradient(90deg, var(--warning), var(--success)); }
  .fit-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .grant-meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; margin: 10px 0; }
  .grant-meta b { color: var(--muted); font-weight: 600; }
  .grant-reason { font-size: 14px; line-height: 1.6; color: var(--text); background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .grant-link { font-size: 12px; color: var(--accent); margin-top: 8px; display: inline-block; word-break: break-all; }

  .summary-card { background: linear-gradient(135deg, rgba(76,175,130,.15), rgba(76,175,130,.04)); border: 1px solid var(--success); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
  .summary-card .total { font-size: 22px; font-weight: 800; color: var(--success); }
  .summary-card .rec { font-size: 14px; line-height: 1.6; margin-top: 8px; }

  /* LOI / proposal sections */
  .section-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .section-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .section-text { font-size: 14px; line-height: 1.7; white-space: pre-line; color: var(--text); }
  .full-doc { width: 100%; min-height: 360px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text); font-size: 14px; line-height: 1.7; font-family: inherit; resize: vertical; }
  .doc-head { display: flex; align-items: center; margin-bottom: 10px; }
  .doc-head .copy-btn { margin-left: auto; }
  .tip { background: rgba(240,165,0,.08); border: 1px solid rgba(240,165,0,.3); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.6; white-space: pre-line; }
  .tip-label { font-weight: 700; color: var(--warning); }

  .copy-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; padding: 6px 12px; cursor: pointer; transition: border-color .15s, color .15s; font-family: inherit; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--success); color: var(--success); }
  .section-actions { margin-top: 10px; display: flex; justify-content: flex-end; }

  .error-msg { background: rgba(229, 115, 115, .1); border: 1px solid rgba(229, 115, 115, .3); border-radius: 8px; padding: 12px 16px; font-size: 14px; color: #e57373; }

  @media (max-width: 600px) { .row-2 { grid-template-columns: 1fr; } .tab { padding: 12px 10px; font-size: 13px; } }
</style>
</head>
<body>

<header>
  <div class="logo"><span>Main Street AI</span> · Grants</div>
  <div class="badge">Free</div>
</header>

<div class="container">
  <h1>Grant writing, without the $120/hour consultant</h1>
  <p class="subtitle">Find grants you can actually win, draft a Letter of Intent, or build a proposal section by section.</p>

  <div class="tabs">
    <button class="tab active" data-tab="find" onclick="switchTab('find')">Find grants</button>
    <button class="tab" data-tab="loi" onclick="switchTab('loi')">Write an LOI</button>
    <button class="tab" data-tab="proposal" onclick="switchTab('proposal')">Proposal section</button>
  </div>

  <!-- ───────────── TAB 1: FIND ───────────── -->
  <div class="panel active" id="panel-find">
    <div class="card">
      <div class="card-title">Your organization</div>
      <div class="row row-2">
        <div class="field"><label>Organization name</label><input id="f_org_name" placeholder="Riverside Food Bank" /></div>
        <div class="field"><label>Organization type</label>
          <select id="f_org_type">
            <option value="food bank">Food bank</option>
            <option value="job training">Job training</option>
            <option value="youth education">Youth education</option>
            <option value="housing">Housing</option>
            <option value="veterans">Veterans</option>
            <option value="environmental">Environmental</option>
            <option value="legal aid">Legal aid</option>
            <option value="health">Health</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="field full" style="margin-bottom:14px"><label>Mission</label><textarea id="f_mission" placeholder="We make sure no family in Riverside County goes hungry."></textarea></div>
      <div class="row row-2">
        <div class="field"><label>City / State</label><input id="f_location" placeholder="Riverside, CA" /></div>
        <div class="field"><label>Annual budget</label>
          <select id="f_annual_budget">
            <option value="under $100k">Under $100k</option>
            <option value="$100k–$500k">$100k–$500k</option>
            <option value="$500k–$1M">$500k–$1M</option>
            <option value="$1M–$5M">$1M–$5M</option>
            <option value="over $5M">Over $5M</option>
          </select>
        </div>
      </div>
      <div class="field full" style="margin-bottom:14px"><label>Who you serve</label><input id="f_population_served" placeholder="Low-income families and seniors in Riverside County" /></div>
      <div class="field full"><label>Primary programs</label><textarea id="f_programs" placeholder="Weekly grocery distribution, summer meals for kids, senior food delivery"></textarea></div>
    </div>
    <button class="generate-btn" id="btn-find" onclick="findGrants()">Find grants we can win</button>
    <div class="results" id="res-find"></div>
  </div>

  <!-- ───────────── TAB 2: LOI ───────────── -->
  <div class="panel" id="panel-loi">
    <div class="card">
      <div class="card-title">Your organization</div>
      <div class="row row-2">
        <div class="field"><label>Organization name</label><input id="l_org_name" placeholder="Riverside Food Bank" /></div>
        <div class="field"><label>Organization type</label>
          <select id="l_org_type">
            <option value="food bank">Food bank</option><option value="job training">Job training</option>
            <option value="youth education">Youth education</option><option value="housing">Housing</option>
            <option value="veterans">Veterans</option><option value="environmental">Environmental</option>
            <option value="legal aid">Legal aid</option><option value="health">Health</option><option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="row row-2">
        <div class="field"><label>Mission</label><textarea id="l_mission" placeholder="Our mission…"></textarea></div>
        <div class="field"><label>City / State</label><input id="l_location" placeholder="Riverside, CA" /></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">The grant</div>
      <div class="row row-2">
        <div class="field"><label>Funder name</label><input id="l_funder_name" placeholder="The Kresge Foundation" /></div>
        <div class="field"><label>Grant / program name</label><input id="l_grant_name" placeholder="Human Services Program Grant" /></div>
      </div>
      <div class="field full" style="margin-bottom:14px"><label>Grant description <span class="hint">(paste the funder's RFP language here — it helps mirror their priorities)</span></label><textarea id="l_grant_description" placeholder="Supports organizations advancing economic mobility for low-income communities…"></textarea></div>
      <div class="row row-2">
        <div class="field"><label>Amount requested</label><input id="l_amount_requested" placeholder="$75,000" /></div>
        <div class="field"><label>What the program does</label><input id="l_program_description" placeholder="Summer meals for 1,200 kids" /></div>
      </div>
      <div class="field full"><label>Your org's relevant strengths</label><textarea id="l_org_strengths" placeholder="15 years serving this community, 94% of donations go to programs, partnerships with 40 local schools"></textarea></div>
    </div>
    <button class="generate-btn" id="btn-loi" onclick="writeLoi()">Write the Letter of Intent</button>
    <div class="results" id="res-loi"></div>
  </div>

  <!-- ───────────── TAB 3: PROPOSAL ───────────── -->
  <div class="panel" id="panel-proposal">
    <div class="card">
      <div class="card-title">Your organization</div>
      <div class="row row-2">
        <div class="field"><label>Organization name</label><input id="p_org_name" placeholder="Riverside Food Bank" /></div>
        <div class="field"><label>Organization type</label>
          <select id="p_org_type">
            <option value="food bank">Food bank</option><option value="job training">Job training</option>
            <option value="youth education">Youth education</option><option value="housing">Housing</option>
            <option value="veterans">Veterans</option><option value="environmental">Environmental</option>
            <option value="legal aid">Legal aid</option><option value="health">Health</option><option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="field full" style="margin-bottom:14px"><label>Mission</label><textarea id="p_mission" placeholder="Our mission…"></textarea></div>
      <div class="field full" style="margin-bottom:14px"><label>Which section do you need?</label>
        <select id="p_section">
          <option>Organization Overview</option>
          <option>Statement of Need</option>
          <option>Program Description</option>
          <option>Goals &amp; Objectives</option>
          <option>Evaluation Plan</option>
          <option>Budget Narrative</option>
          <option>Sustainability Plan</option>
        </select>
      </div>
      <div class="field full"><label>Context <span class="hint">(local data, the program, the population, anything specific)</span></label><textarea id="p_context" placeholder="1 in 5 kids in our county is food insecure. Our summer program reached 1,200 children last year across 40 sites…"></textarea></div>
    </div>
    <button class="generate-btn" id="btn-proposal" onclick="writeSection()">Draft this section</button>
    <div class="results" id="res-proposal"></div>
  </div>
</div>

<script>
  const WORKER_URL = 'https://main-street-grants.YOUR_SUBDOMAIN.workers.dev';
  let lastGrants = [];

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${name}`));
  }

  function val(id) { return document.getElementById(id).value.trim(); }
  function busy(btnId, label) { const b = document.getElementById(btnId); b.disabled = true; b.dataset.label = b.textContent; b.innerHTML = `<span class="spinner"></span>${label}`; }
  function unbusy(btnId) { const b = document.getElementById(btnId); b.disabled = false; b.textContent = b.dataset.label; }
  function err(resId, msg) { document.getElementById(resId).innerHTML = `<div class="error-msg">${htmlEsc(msg)}</div>`; }

  async function postJSON(path, payload) {
    const res = await fetch(`${WORKER_URL}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // ── Tab 1: Find ──
  async function findGrants() {
    const payload = {
      org_name: val('f_org_name'), org_type: val('f_org_type'), mission: val('f_mission'),
      location: val('f_location'), population_served: val('f_population_served'),
      annual_budget: val('f_annual_budget'), programs: val('f_programs'),
    };
    if (!payload.org_name) return err('res-find', 'Please enter your organization name.');
    busy('btn-find', 'Researching grants…');
    document.getElementById('res-find').innerHTML = '';
    try {
      const data = await postJSON('/find', payload);
      lastGrants = Array.isArray(data.grants) ? data.grants : [];
      renderGrants(data);
    } catch (e) { err('res-find', `Could not find grants: ${e.message}`); }
    finally { unbusy('btn-find'); }
  }

  function awardNum(s) { const m = String(s || '').replace(/,/g, '').match(/\d+/g); return m ? Math.max(...m.map(Number)) : 0; }

  function renderGrants(data) {
    const el = document.getElementById('res-find');
    if (!lastGrants.length) { el.innerHTML = `<div class="error-msg">No matching grants returned. Try adding more detail about your programs.</div>`; return; }
    el.innerHTML = `
      <div class="results-header">${lastGrants.length} grant${lastGrants.length>1?'s':''} matched
        <select id="sortBy" onchange="resortGrants()">
          <option value="fit">Sort by fit score</option>
          <option value="award">Sort by award amount</option>
        </select>
      </div>
      ${data.total_potential || data.priority_recommendation ? `<div class="summary-card">
        ${data.total_potential ? `<div class="total">${htmlEsc(data.total_potential)}</div><div class="fit-label">estimated total available</div>` : ''}
        ${data.priority_recommendation ? `<div class="rec"><b>Where to start:</b> ${htmlEsc(data.priority_recommendation)}</div>` : ''}
      </div>` : ''}
      <div id="grant-list"></div>`;
    paintGrantList();
  }

  function resortGrants() {
    const by = document.getElementById('sortBy').value;
    lastGrants.sort((a, b) => by === 'award' ? awardNum(b.estimated_award) - awardNum(a.estimated_award) : (b.fit_score||0) - (a.fit_score||0));
    paintGrantList();
  }

  function paintGrantList() {
    const list = document.getElementById('grant-list');
    list.innerHTML = lastGrants.map(g => {
      const score = Number(g.fit_score) || 0;
      return `<div class="grant-card">
        <div class="grant-top">
          <div>
            <div class="grant-name">${htmlEsc(g.name || 'Grant')}</div>
            <div class="grant-funder">${htmlEsc(g.funder || '')}</div>
          </div>
          <span class="grant-type">${htmlEsc(g.type || 'other')}</span>
          <div class="fit">
            <div class="fit-score">${score}/10</div>
            <div class="fit-bar"><div class="fit-fill" style="width:${score*10}%"></div></div>
            <div class="fit-label">fit</div>
          </div>
        </div>
        <div class="grant-meta">
          <span><b>Award:</b> ${htmlEsc(g.estimated_award || 'Unknown')}</span>
          <span><b>Deadline:</b> ${htmlEsc(g.deadline_note || 'Unknown')}</span>
        </div>
        ${g.fit_reason ? `<div class="grant-reason">${htmlEsc(g.fit_reason)}</div>` : ''}
        ${g.apply_url_hint ? `<a class="grant-link" href="${attr(/^https?:/.test(g.apply_url_hint)?g.apply_url_hint:'https://'+g.apply_url_hint)}" target="_blank" rel="noopener">${htmlEsc(g.apply_url_hint)} ↗</a>` : ''}
      </div>`;
    }).join('');
  }

  // ── Tab 2: LOI ──
  async function writeLoi() {
    const payload = {
      org_name: val('l_org_name'), org_type: val('l_org_type'), mission: val('l_mission'), location: val('l_location'),
      funder_name: val('l_funder_name'), grant_name: val('l_grant_name'), grant_description: val('l_grant_description'),
      amount_requested: val('l_amount_requested'), program_description: val('l_program_description'), org_strengths: val('l_org_strengths'),
    };
    if (!payload.org_name || !payload.funder_name || !payload.grant_name) return err('res-loi', 'Organization name, funder name, and grant name are required.');
    busy('btn-loi', 'Drafting your LOI…');
    document.getElementById('res-loi').innerHTML = '';
    try { renderLoi(await postJSON('/loi', payload)); }
    catch (e) { err('res-loi', `Could not write the LOI: ${e.message}`); }
    finally { unbusy('btn-loi'); }
  }

  function renderLoi(d) {
    const sections = [
      ['Opening', d.opening_paragraph], ['Problem statement', d.problem_statement],
      ['Program description', d.program_description], ['Organizational capacity', d.organizational_capacity],
      ['Budget overview', d.budget_overview], ['Closing', d.closing_paragraph],
    ].filter(([, v]) => v);
    const el = document.getElementById('res-loi');
    el.innerHTML = `
      <div class="results-header">Your Letter of Intent</div>
      ${d.subject_line ? `<div class="section-block"><div class="section-label">Subject line</div><div class="section-text">${htmlEsc(d.subject_line)}</div></div>` : ''}
      <div class="section-block">
        <div class="doc-head"><div class="section-label" style="margin:0">Full letter — ready to copy</div><button class="copy-btn" id="loi-copy">Copy letter</button></div>
        <textarea class="full-doc" id="loi-full">${htmlEsc(d.full_loi || sections.map(([, v]) => v).join('\n\n'))}</textarea>
      </div>
      <div class="results-header" style="margin-top:24px">Edit by section</div>
      ${sections.map(([label, v], i) => `<div class="section-block">
        <div class="doc-head"><div class="section-label" style="margin:0">${label}</div><button class="copy-btn" data-copy="${attr(v)}">Copy</button></div>
        <div class="section-text">${htmlEsc(v)}</div>
      </div>`).join('')}`;
    document.getElementById('loi-copy').addEventListener('click', (e) => copyText(e.target, document.getElementById('loi-full').value));
    el.querySelectorAll('.copy-btn[data-copy]').forEach(b => b.addEventListener('click', () => copyText(b, b.getAttribute('data-copy'))));
  }

  // ── Tab 3: Proposal section ──
  async function writeSection() {
    const payload = { org_name: val('p_org_name'), org_type: val('p_org_type'), mission: val('p_mission'), section: val('p_section'), context: val('p_context') };
    if (!payload.org_name) return err('res-proposal', 'Please enter your organization name.');
    busy('btn-proposal', 'Drafting the section…');
    document.getElementById('res-proposal').innerHTML = '';
    try { renderSection(await postJSON('/proposal-section', payload)); }
    catch (e) { err('res-proposal', `Could not draft the section: ${e.message}`); }
    finally { unbusy('btn-proposal'); }
  }

  function renderSection(d) {
    const el = document.getElementById('res-proposal');
    el.innerHTML = `
      <div class="results-header">${htmlEsc(d.section_title || 'Draft')}</div>
      <div class="section-block">
        <div class="doc-head"><div class="section-label" style="margin:0">Draft</div><button class="copy-btn" data-copy="${attr(d.draft)}">Copy</button></div>
        <div class="section-text">${htmlEsc(d.draft || '')}</div>
      </div>
      ${d.what_to_customize ? `<div class="section-block"><div class="section-label">What to customize</div><div class="tip"><span class="tip-label">Add your specifics:</span>\n${htmlEsc(d.what_to_customize)}</div></div>` : ''}
      ${d.common_mistakes ? `<div class="section-block"><div class="section-label">Common mistakes to avoid</div><div class="tip"><span class="tip-label">Watch out:</span>\n${htmlEsc(d.common_mistakes)}</div></div>` : ''}`;
    el.querySelectorAll('.copy-btn[data-copy]').forEach(b => b.addEventListener('click', () => copyText(b, b.getAttribute('data-copy'))));
  }

  // ── Helpers ──
  async function copyText(btn, text) {
    try { await navigator.clipboard.writeText(text); const o = btn.textContent; btn.textContent = 'Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 2000); } catch {}
  }
  function htmlEsc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function attr(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
</script>
</body>
